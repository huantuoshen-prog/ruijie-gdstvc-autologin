<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="RUIJIE 锐捷校园网自动认证：路由器、锐捷认证、互联网">
  <style>
    .mono { font-family: "JetBrains Mono", "SF Mono", "Cascadia Mono", Consolas, monospace; }
    .sans { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
    .ink { fill: #1b1a17; }
    .muted { fill: #7a7468; }
    .packet { animation: move 2.6s linear infinite; }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(300px); } }
    @keyframes blink { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .packet, .blink { animation: none; } }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1b1a17" fill-opacity=".09" />
    </pattern>
    <pattern id="dash" width="8" height="2" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#b3ac9f" />
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="#efebe3" />
  <rect width="1280" height="400" fill="url(#dots)" />
  <rect x="24" y="24" width="1232" height="352" rx="6" fill="#faf8f4" stroke="#1b1a17" stroke-width="2" />
  <rect x="25" y="25" width="10" height="350" fill="#2b8a57" />

  <!-- 标识 -->
  <rect x="72" y="62" width="20" height="20" rx="4" class="ink" />
  <circle cx="82" cy="72" r="4.5" fill="#e8590c" class="blink" />
  <text x="106" y="78" class="mono ink" font-size="17" font-weight="700" letter-spacing="3">RUIJIE</text>
  <line x1="200" y1="62" x2="200" y2="82" stroke="#d8d2c6" />
  <text x="214" y="78" class="sans muted" font-size="15">校园网认证核心</text>
  <text x="1208" y="78" text-anchor="end" class="mono muted" font-size="13" letter-spacing="1.5">OPENWRT · ISTOREOS · IMMORTALWRT</text>

  <!-- 标题 -->
  <text x="72" y="164" class="sans ink" font-size="54" font-weight="700">锐捷校园网自动认证</text>
  <text x="72" y="206" class="sans muted" font-size="19">广东科学技术职业学院 · 路由器自动登录与断线重连</text>

  <!-- 连接链路 -->
  <line x1="72" y1="252" x2="1208" y2="252" stroke="#d8d2c6" stroke-dasharray="4 4" />
  <g class="sans">
    <circle cx="78" cy="300" r="6" fill="#2b8a57" />
    <circle cx="78" cy="300" r="10" fill="#2b8a57" fill-opacity=".2" />
    <text x="96" y="306" class="muted" font-size="16">路由器</text>
    <text x="72" y="338" class="mono ink" font-size="17" font-weight="700">ruijiectl</text>

    <rect x="250" y="299" width="300" height="3" fill="#2b8a57" />
    <g class="packet"><rect x="244" y="295" width="22" height="11" rx="5.5" fill="#faf8f4" stroke="#2b8a57" stroke-width="2.5" /></g>

    <circle cx="610" cy="300" r="6" fill="#2b8a57" />
    <circle cx="610" cy="300" r="10" fill="#2b8a57" fill-opacity=".2" />
    <text x="628" y="306" class="muted" font-size="16">锐捷认证</text>
    <text x="604" y="338" class="mono ink" font-size="17" font-weight="700">ePortal</text>

    <rect x="760" y="299" width="300" height="3" fill="#2b8a57" />
    <g class="packet" style="animation-delay: -1.3s"><rect x="754" y="295" width="22" height="11" rx="5.5" fill="#faf8f4" stroke="#2b8a57" stroke-width="2.5" /></g>

    <circle cx="1112" cy="300" r="6" fill="#2b8a57" />
    <circle cx="1112" cy="300" r="10" fill="#2b8a57" fill-opacity=".2" />
    <text x="1130" y="306" class="muted" font-size="16">互联网</text>
    <text x="1106" y="338" class="mono ink" font-size="17" font-weight="700">在线</text>
  </g>
</svg>
